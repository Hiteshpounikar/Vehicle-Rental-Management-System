{% extends "base.html" %}{% block title %}Book Vehicle | VehicleRent{% endblock %}{% block content %}
<h1>Book {{ vehicle.make }} {{ vehicle.model }}</h1><p class="muted">Daily rate: {{ vehicle.daily_rate|money }}</p>
<form class="form" method="post"><label>Full name<input name="full_name" required maxlength="100" value="{{ request.form.get('full_name','') }}"></label><label>Email<input type="email" name="email" required value="{{ request.form.get('email','') }}"></label><label>Phone<input name="phone" required maxlength="20" value="{{ request.form.get('phone','') }}"></label><label>Driving licence number<input name="driving_license_no" required maxlength="40" value="{{ request.form.get('driving_license_no','') }}"></label><div class="two"><label>Pickup date<input type="date" name="start_date" min="{{ today }}" required value="{{ request.form.get('start_date','') }}"></label><label>Return date<input type="date" name="end_date" min="{{ today }}" required value="{{ request.form.get('end_date','') }}"></label></div><button class="button full" type="submit">Confirm booking</button><p class="muted">Demo project: use sample details, not sensitive real data.</p></form>{% endblock %}
