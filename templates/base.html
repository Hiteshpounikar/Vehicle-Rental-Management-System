<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}VehicleRent{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('index') }}">🚗 Vehicle<span>Rent</span></a><nav><a href="{{ url_for('index') }}">Vehicles</a><a href="{{ url_for('admin') }}">Admin Dashboard</a></nav></header>
<main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="messages">{% for category,message in messages %}<p class="{{ category }}">{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main><footer>DBMS Mini-Project · Vehicle Rental Management System</footer></body></html>
